name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 (glibc 2.35) so the binary also runs on older distros and SteamOS.
          - os: ubuntu-22.04
            bin: nikke-check
            artifact: nikke-check-linux-x86_64
          - os: windows-latest
            bin: nikke-check.exe
            artifact: nikke-check-windows-x86_64
          - os: macos-latest
            bin: nikke-check
            artifact: nikke-check-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Update Rust
        run: rustup update stable && rustup default stable

      # rfd uses the XDG desktop portal by default, so no GTK is needed.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev pkg-config

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --locked

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Name the binaries per platform
        run: |
          mkdir out
          cp dist/nikke-check-linux-x86_64/nikke-check out/nikke-check-linux-x86_64
          cp dist/nikke-check-macos-arm64/nikke-check out/nikke-check-macos-arm64
          cp dist/nikke-check-windows-x86_64/nikke-check.exe out/nikke-check-windows-x86_64.exe
          chmod +x out/nikke-check-linux-x86_64 out/nikke-check-macos-arm64
          cd out && sha256sum nikke-check-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
