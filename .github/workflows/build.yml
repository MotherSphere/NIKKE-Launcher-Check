name: build

# Builds and tests on the three platforms for every push and pull request.
# release.yml calls it with the release tag to build the binaries it publishes.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      signing-policy:
        description: "SignPath signing policy for the Windows binary"
        type: choice
        options: [none, test-signing, release-signing]
        default: none
  workflow_call:
    inputs:
      ref:
        description: "Tag or commit to build"
        required: true
        type: string
      signing-policy:
        description: "SignPath signing policy for the Windows binary, or none"
        required: false
        type: string
        default: none
    secrets:
      SIGNPATH_API_TOKEN:
        required: false

# actions: read lets the SignPath action read the job and download the unsigned artifact.
permissions:
  contents: read
  actions: read

env:
  # The binaries users download are built by a known compiler.
  RUST_VERSION: "1.99.1"
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 (glibc 2.35) so the binary also runs on older distros and SteamOS.
          - os: ubuntu-22.04
            bin: nikke-check
            artifact: nikke-check-linux-x86_64
          - os: windows-latest
            bin: nikke-check.exe
            artifact: nikke-check-windows-x86_64
          - os: macos-latest
            bin: nikke-check
            artifact: nikke-check-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false

      - name: Install the pinned toolchain
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal && rustup default ${{ env.RUST_VERSION }}

      # rfd uses the XDG desktop portal by default, so no GTK is needed.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev pkg-config

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      # The binary must start and give the "NIKKE not found" exit code on an empty folder.
      - name: Smoke-test the binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/empty"
          ./target/release/nikke-check --help
          set +e
          ./target/release/nikke-check --cli "$RUNNER_TEMP/empty"
          code=$?
          set -e
          test "$code" -eq 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}
          if-no-files-found: error

      # The SignPath artifact configuration expects a bare PE file, so the exe is also
      # uploaded unzipped. With archive: false the artifact is named after the file.
      - name: Upload the unzipped exe for SignPath
        id: upload-exe
        if: runner.os == 'Windows' && inputs.signing-policy != '' && inputs.signing-policy != 'none'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/nikke-check.exe
          archive: false
          if-no-files-found: error

      - name: Sign the Windows binary through SignPath
        if: runner.os == 'Windows' && inputs.signing-policy != '' && inputs.signing-policy != 'none'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: d2490d1f-b2fe-4d0b-9146-5b197a735917
          project-slug: NIKKE-Launcher-Check
          signing-policy-slug: ${{ inputs.signing-policy }}
          github-artifact-id: ${{ steps.upload-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          skip-decompress: true

      # The test certificate is self-signed, so only check that a signature is there, not that Windows trusts it.
      - name: Check the signature
        if: runner.os == 'Windows' && inputs.signing-policy != '' && inputs.signing-policy != 'none'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed/nikke-check.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($null -eq $sig.SignerCertificate) { throw "signed/nikke-check.exe has no Authenticode signature" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows' && inputs.signing-policy != '' && inputs.signing-policy != 'none'
        with:
          name: ${{ matrix.artifact }}-signed
          path: signed/nikke-check.exe
          if-no-files-found: error
