name: release

# release-please keeps a release PR open from the conventional commits on main.
# Merging that PR creates the tag and the GitHub release. The jobs below then
# build the binaries from that tag and attach them in the same run: a release
# created with GITHUB_TOKEN fires no event another workflow could start from.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # No `release-type` input: when it is set, the action ignores both files.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Kept as a draft until the binaries are attached, so the release never shows without downloads.
      - name: Hold the release as a draft
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=true

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      signing-policy: release-signing
    secrets:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

  publish:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For the build provenance attestations.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Name the binaries per platform
        run: |
          mkdir out
          cp dist/nikke-check-linux-x86_64/nikke-check out/nikke-check-linux-x86_64
          cp dist/nikke-check-macos-arm64/nikke-check out/nikke-check-macos-arm64
          cp dist/nikke-check-windows-x86_64-signed/nikke-check.exe out/nikke-check-windows-x86_64.exe
          chmod +x out/nikke-check-linux-x86_64 out/nikke-check-macos-arm64
          cd out && sha256sum nikke-check-* > SHA256SUMS.txt

      # Lets anyone check with `gh attestation verify` that a file came from this workflow and commit.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/nikke-check-*

      # `-R` because this job has no checkout for gh to read the repository from.
      - name: Attach the binaries and publish
        run: |
          gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --draft=false --latest
