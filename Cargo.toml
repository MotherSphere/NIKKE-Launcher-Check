[package]
name = "nikke-launcher-check"
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Read-only check for traces of the November 2026 NIKKE PC launcher compromise"
publish = false

[[bin]]
name = "nikke-check"
path = "src/main.rs"

[dependencies]
# canvas: the scan ring and the icons, drawn in code (no font files).
# image-without-codecs plus image's png feature: the helper picture, with the PNG decoder only.
iced = { version = "0.14", features = ["canvas", "image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
walkdir = "2"
# Process list only, for the "launcher is running now" check.
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# getfsstat, to leave network volumes out of a computer scan.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Dev builds: cargo build --profile fast
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
